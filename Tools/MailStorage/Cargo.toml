[package]
name = "protonx-mail-storage"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }
zeroize = { workspace = true }
tempfile = { workspace = true }
libc = "0.2"

[dev-dependencies]
mail-common = { workspace = true, features = ["test-utils"] }
mail-stash = { workspace = true, features = ["protonx-encrypted"] }
mail-crypto-inbox = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
