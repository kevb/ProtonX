[package]
name = "protonx-mail-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only"
publish = false

[dependencies]
mail-uniffi = { path = "../project/mail/rust/mail/mail-uniffi", features = ["protonx-native"] }
mail-uniffi-common = { workspace = true }
mail-account-uniffi = { workspace = true }
mail-issue-reporter-service-uniffi = { workspace = true }
mail-issue-reporter-service = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
security-framework = "3.7.0"
html2text = "0.16.2"
async-trait = { workspace = true }
protonx-mail-storage = { path = "../protonx-mail-storage", default-features = false }
zeroize = { workspace = true, optional = true }
mail-stash = { workspace = true }
mail-common = { workspace = true }
mail-html-transformer = { workspace = true }
url = { workspace = true }

[features]
# Explicit opt-in while migration/attachment storage is being validated.
secure-storage = ["protonx-mail-storage/encryption", "dep:zeroize", "mail-stash/protonx-encrypted", "mail-common/protonx-encrypted"]

[[bin]]
name = "protonx-mail"
path = "src/main.rs"
