name: macOS
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Swift contracts and security policies
        run: swift test
      - name: Synthetic Bridge TLS integration
        run: |
          scripts/test-bridge.sh
          scripts/test-bridge.sh --starttls
      - name: Credential-provider feasibility contracts
        run: scripts/test-credential-provider.sh
      - name: Native app build
        run: swift build -c release
      - name: Native Spotlight launchers and atomic installation contracts
        run: |
          scripts/build-launchers.sh
          python3 Tools/ProductLauncher/test_install.py
  helper:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Calendar Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.4'
          cache: false
      - name: Build pinned Proton helper and run public tests
        run: |
          scripts/build-helper.sh
          scripts/test-helper.sh
      - name: Verify patched corresponding source archive
        run: scripts/source-bundle.sh
  mail:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned native Mail core and test synthetic decryption and paging
        run: |
          scripts/build-mail-helper.sh
          scripts/test-mail-helper.sh
      - name: Opt-in encrypted Mail storage and cache-first contracts
        run: scripts/test-mail-storage.sh
  calendar:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Calendar Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.4'
          cache: false
      - name: Build pinned native Calendar adapter and test synthetic SRP, keys and recurrence
        run: |
          scripts/build-calendar-helper.sh
          scripts/test-calendar-helper.sh
