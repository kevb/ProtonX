name: macOS
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Swift contracts and security policies
        run: swift test
      - name: Synthetic Bridge TLS integration
        run: |
          scripts/test-bridge.sh
          scripts/test-bridge.sh --starttls
      - name: Credential-provider feasibility contracts
        run: scripts/test-credential-provider.sh
      - name: Native app build
        run: swift build -c release
  helper:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned Proton helper and run public tests
        run: |
          scripts/build-helper.sh
          scripts/test-helper.sh
      - name: Verify patched corresponding source archive
        run: scripts/source-bundle.sh
  mail:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned native Mail core and test synthetic decryption and paging
        run: |
          scripts/build-mail-helper.sh
          scripts/test-mail-helper.sh
